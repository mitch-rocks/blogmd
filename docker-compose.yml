# BlogMD + MongoDB on Docker Swarm:  docker stack deploy -c docker-compose.yml blogmd
#
# One-time setup on a manager node (10+ character password):
#     printf '%s' 'your-long-password' | docker secret create blogmd_admin_password -
#
# All state (posts, users, settings, media metadata and uploaded files via GridFS) lives in the
# `mongo-data` volume on au-per-001 — back that up, e.g.:
#     docker exec $(docker ps -qf name=blogmd_mongo) mongodump --archive --gzip > blogmd-$(date +%F).archive.gz

services:
  blogmd:
    image: ghcr.io/nnitch/blogmd:latest
    environment:
      DATABASE_URL: "mongodb://mongo:27017/blogmd?replicaSet=rs0"
      MEDIA_URL: "gridfs://"
      SITE_NAME: "Mitch Naake"
      ADMIN_USERNAME: mitch
      ADMIN_PASSWORD_FILE: /run/secrets/blogmd_admin_password
      # Browsers reach the site over HTTPS (Cloudflare), so session cookies are HTTPS-only:
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY: "1"                     # Traefik
      REAL_IP_HEADER: CF-Connecting-IP     # real visitor IP for login throttling (see note in README)
    secrets:
      - blogmd_admin_password
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - proxy
      - backend
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.hostname == au-per-001
      update_config:
        order: start-first                 # safe: the app keeps no state; the new task must pass
        parallelism: 1                     # /healthz before the old one is stopped
        delay: 10s
        failure_action: rollback           # a new image that never gets healthy is rolled back
      labels:
        - traefik.enable=true
        - traefik.docker.network=proxy
        - traefik.http.routers.blogmd.rule=Host(`mitch.rocks`)
        - traefik.http.routers.blogmd.entrypoints=web
        - traefik.http.services.blogmd.loadbalancer.server.port=8001

  mongo:
    image: mongo:8.0
    # Swarm only adds a task to DNS once it is healthy, but the health check initiates the replica
    # set as "mongo:27017", which mongod requires to resolve to itself. Setting the container's own
    # hostname makes that resolve locally (/etc/hosts), breaking the chicken-and-egg wait.
    hostname: mongo
    # single-node replica set: enables transactions (atomic post + media-link saves)
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    # on a small host, cap MongoDB's cache (default is ~50% of RAM):
    # command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    volumes:
      - mongo-data:/data/db
    networks:
      - backend                            # private: only BlogMD can reach it, no published port
    healthcheck:
      # healthy once the replica set exists; the first run creates it
      test: >-
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    stop_grace_period: 60s                 # let mongod flush and shut down cleanly
    deploy:
      mode: replicated
      replicas: 1
      # DNS round-robin instead of Swarm's virtual IP: "mongo" resolves straight to the container.
      # Needed for the replica set to recognise its own address, and avoids IPVS silently dropping
      # database connections that sit idle for more than 15 minutes.
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.hostname == au-per-001    # the node that holds the mongo-data volume
      update_config:
        order: stop-first                  # never two mongods on the same data files

volumes:
  mongo-data:

secrets:
  blogmd_admin_password:
    external: true                         # created once with `docker secret create` (see top)

networks:
  proxy:
    external: true
  backend:
    driver: overlay
    internal: true                         # no route to the internet or host; app <-> mongo only
