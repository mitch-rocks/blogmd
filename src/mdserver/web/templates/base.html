<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% block meta %}{% endblock %}
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    {% if brand_icon_url %}<link rel="icon" href="{{ brand_icon_url }}">
    <link rel="apple-touch-icon" href="{{ brand_icon_url }}">{% else %}<link rel="icon" href="/favicon.ico">{% endif %}
    <meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <script>
        /* apply a saved Light/Dark choice before first paint (no flash); otherwise follow the OS */
        (function () {
            try {
                var t = localStorage.getItem('blogmd:theme');
                if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
            } catch (e) { /* storage unavailable: follow the OS */ }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,400..800;1,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Source+Code+Pro:ital,wght@0,400..700;1,400..700&display=swap">

    {% block highlight %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" media="print" onload="this.media='all'; this.onload=null;">
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" onload="window.dispatchEvent(new Event('hljs-ready'))"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', ')\\']], displayMath: [['$', '$']] },
            options: {
                makeCollapsible: false, enableMenu: false,
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
                menuOptions: { settings: { enrich: false } }
            }
        };
    </script>
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/4.1.3/tex-mml-svg.min.js"></script>
    {% endblock %}

    <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
